name: Warm docs images

on:
  schedule:
    - cron: "31 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-docs-images
  cancel-in-progress: false

jobs:
  warm-images:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test image discovery and refresh requests
        run: bun test tests/warm-docs-images.test.mjs tests/circuit-preview-images.test.mjs
      - name: Build all docs pages
        run: bun run build
      - name: Refresh every docs image
        run: bun run warm:images
      - name: Upload image refresh report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-cache-report
          path: build/image-cache-report*
          retention-days: 14
