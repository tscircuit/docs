name: Verify adapter cable docs preview
on:
  push:
    branches: [codex/verify-adapter-docs-preview-20261008]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed page and image
        run: |
          curl --fail --location --retry 3 --max-time 30 https://docs-git-codex-adapter-cable-preview-20261008-tscircuit.vercel.app/elements/assembly-cable -o page.html
          python3 - <<'PY'
          from pathlib import Path
          page = Path("page.html").read_text()
          for text in ["connect-different-cable-ends", "adaptercable_a", "assembly-cable-adapter.png"]:
              assert text in page, f"Missing preview content: {text}"
          print("Verified deployed cable page and adapter example")
          PY
          curl --fail --location --retry 3 --max-time 30 https://docs-git-codex-adapter-cable-preview-20261008-tscircuit.vercel.app/img/elements/assembly-cable-adapter.png -o adapter.png
          python3 - <<'PY'
          from pathlib import Path
          assert Path("adapter.png").read_bytes().startswith(b"\x89PNG\r\n\x1a\n")
          print("Verified deployed adapter image")
          PY
